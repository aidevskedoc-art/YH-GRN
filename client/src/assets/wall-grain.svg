<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <!--
    Seamless concrete grain. Every layer is mid-grey on average, so the tile is
    blended (overlay / soft-light) into whatever surface colour it lands on
    rather than painted over it - one asset serves both the dark and the light
    skin. stitchTiles="stitch" is what keeps the noise continuous across the
    repeat; no filter here may blur, because a blur samples past the tile edge
    and puts a visible grid on the wall.
  -->
  <defs>
    <filter id="mottle" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="4" seed="12" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0
                                           0.33 0.33 0.33 0 0
                                           0.33 0.33 0.33 0 0
                                           0    0    0    0 1"/>
      <!-- Pulls the cloud back towards mid-grey: patches, not blotches. -->
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.24" intercept="0.38"/>
        <feFuncG type="linear" slope="0.24" intercept="0.38"/>
        <feFuncB type="linear" slope="0.24" intercept="0.38"/>
      </feComponentTransfer>
    </filter>

    <filter id="grit" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="4" seed="5" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0
                                           0.33 0.33 0.33 0 0
                                           0.33 0.33 0.33 0 0
                                           0    0    0    0 1"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.95" intercept="0.02"/>
        <feFuncG type="linear" slope="0.95" intercept="0.02"/>
        <feFuncB type="linear" slope="0.95" intercept="0.02"/>
      </feComponentTransfer>
    </filter>

    <!-- Sparse aggregate: the discrete transfer thresholds the noise, so only
         the few brightest cells survive as flecks in the pour. -->
    <filter id="aggregate" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.22" numOctaves="2" seed="31" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.5
                                           0 0 0 0 0.5
                                           0 0 0 0 0.5
                                           1 0 0 0 0"/>
      <feComponentTransfer>
        <feFuncA type="discrete" tableValues="0 0 0 0 0 0 0.5 1"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="320" height="320" filter="url(#mottle)"/>
  <rect width="320" height="320" filter="url(#grit)" opacity="0.5" style="mix-blend-mode:overlay"/>
  <rect width="320" height="320" filter="url(#aggregate)" opacity="0.20" style="mix-blend-mode:overlay"/>
</svg>
